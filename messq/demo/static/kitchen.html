<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Food Status</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --border: #e3e2de;
  --text: #0b0b0b; --text-2: #52514e;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --text: #f0efec; --text-2: #c3c2b7; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --text: #f0efec; --text-2: #c3c2b7; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 720px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p { color: var(--text-2); margin: 0 0 18px; }
.mess { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.name { font-size: 20px; font-weight: 700; }
.now { font-size: 14px; color: var(--text-2); }
.btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
button { font: inherit; font-size: 17px; font-weight: 650; padding: 18px 8px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
button i { font-style: normal; display: block; font-size: 22px; }
button.low i { color: var(--warning); } button.out i { color: var(--critical); } button.ok i { color: var(--good); }
button.active { border-color: var(--text); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; display: none; }
</style>
</head>
<body>
<main>
  <h1>Kitchen: food status</h1>
  <p>Tap when a tray is running low, has run out, or has been refilled. Students are steered away from a hall that is out of food.</p>
  <div id="messes"></div>
</main>
<div id="toast"></div>
<script>
const LABEL = { ok: "Food OK", low: "Tray low", out: "Out of food" };
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function toast(t) { const el = document.getElementById("toast"); el.textContent = t; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 1800); }
async function tap(mess, state, name) {
  await fetch("/api/kitchen", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ mess, state }) });
  toast(`${name}: ${LABEL[state]} sent`); poll();
}
async function poll() {
  const s = await (await fetch("/api/state")).json();
  document.getElementById("messes").innerHTML = s.advice.halls.map(h => `
    <div class="mess">
      <div class="top"><span class="name">${esc(h.name)}</span><span class="now">System thinks: <b>${LABEL[h.food]}</b></span></div>
      <div class="btns">
        <button class="low ${h.food === "low" ? "active" : ""}" data-m="${h.id}" data-s="low" data-n="${esc(h.name)}"><i>▲</i>Tray low</button>
        <button class="out ${h.food === "out" ? "active" : ""}" data-m="${h.id}" data-s="out" data-n="${esc(h.name)}"><i>■</i>Out</button>
        <button class="ok ${h.food === "ok" ? "active" : ""}" data-m="${h.id}" data-s="ok" data-n="${esc(h.name)}"><i>●</i>Refilled</button>
      </div>
    </div>`).join("");
  document.querySelectorAll("button[data-m]").forEach(b => b.onclick = () => tap(b.dataset.m, b.dataset.s, b.dataset.n));
}
poll(); setInterval(poll, 3000);
</script>
</body>
</html>
