<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Login</title>
<style>
:root { color-scheme: light; --bg: #f4f3f0; --surface: #fcfcfb; --border: #e3e2de; --text: #0b0b0b; --text-2: #52514e; --critical: #d03b3b; --link: #2a78d6; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark; --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --text: #f0efec; --text-2: #c3c2b7; --link: #3987e5; }
}
:root[data-theme="dark"] { color-scheme: dark; --bg: #111110; --surface: #1a1a19; --border: #2e2e2c; --text: #f0efec; --text-2: #c3c2b7; --link: #3987e5; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 4px; }
p { color: var(--text-2); margin: 0 0 18px; font-size: 14px; }
label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: inherit; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
button { width: 100%; margin-top: 14px; font: inherit; font-weight: 650; padding: 11px; border-radius: 10px; border: 0; background: var(--text); color: var(--surface); cursor: pointer; }
.err { color: var(--critical); font-size: 14px; min-height: 20px; margin-top: 10px; }
.foot { margin-top: 16px; font-size: 13px; color: var(--text-2); }
.foot a { color: var(--link); }
</style>
</head>
<body>
<form id="f">
  <h1>Staff login</h1>
  <p>Mess managers only. Students don't need to log in.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button type="submit">Log in</button>
  <div class="err" id="err" role="alert"></div>
  <div class="foot">Looking for which mess to go to? <a href="/">Student page</a></div>
</form>
<script>
const next = new URLSearchParams(location.search).get("next") || "";
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById("err");
  err.textContent = "";
  const r = await fetch("/api/login", {
    method: "POST", headers: { "Content-Type": "application/json", "X-Messq": "1" },
    body: JSON.stringify({ password: document.getElementById("pw").value, next })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { err.textContent = j.error || "Couldn't log in."; return; }
  location.href = j.next;
};
</script>
</body>
</html>
