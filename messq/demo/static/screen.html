<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Mess Now</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #2e2e2c;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e88;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --track: #2a2a28;
  --tint-good: rgb(12 163 12 / .16); --tint-warning: rgb(250 178 25 / .14); --tint-go: rgb(57 135 229 / .18);
  --go: #3987e5;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efeb; --border: #e3e2de;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --track: #e6e5e1;
    --tint-good: rgb(12 163 12 / .10); --tint-warning: rgb(250 178 25 / .14); --tint-go: rgb(42 120 214 / .10);
    --go: #2a78d6;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #f0efeb; --border: #e3e2de;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --track: #e6e5e1;
  --tint-good: rgb(12 163 12 / .10); --tint-warning: rgb(250 178 25 / .14); --tint-go: rgb(42 120 214 / .10);
  --go: #2a78d6;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; gap: clamp(14px, 2.5vh, 28px); max-width: 1200px; width: 100%; margin: 0 auto; padding: clamp(16px, 3vh, 36px) 16px; }
.top { display: flex; justify-content: space-between; align-items: baseline; color: var(--text-2); font-size: clamp(14px, 1.8vw, 20px); }
.top b { color: var(--text); }
.clock { font-variant-numeric: tabular-nums; }
.hero { border-radius: 22px; padding: clamp(18px, 3.5vh, 40px) clamp(18px, 3vw, 40px); background: var(--surface); border: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: center; }
.hero.good { background: var(--tint-good); } .hero.warning { background: var(--tint-warning); } .hero.go { background: var(--tint-go); }
.say { font-size: clamp(34px, 6.4vw, 84px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.04; }
.why { color: var(--text-2); font-size: clamp(17px, 2.4vw, 28px); margin-top: 10px; }
.why b { color: var(--text); font-variant-numeric: tabular-nums; }
.perk { margin-top: 10px; font-size: clamp(15px, 2vw, 22px); font-weight: 600; }
.arrow { font-size: clamp(80px, 14vw, 180px); font-weight: 800; color: var(--go); line-height: 1; text-align: center; }
.arrow small { display: block; font-size: clamp(14px, 1.8vw, 20px); font-weight: 650; color: var(--text-2); margin-top: 4px; }
@media (prefers-reduced-motion: no-preference) {
  .arrow.pulse span { display: inline-block; animation: nudge 1.6s ease-in-out infinite; }
  .arrow.left.pulse span { animation-name: nudgeL; }
}
@keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(14px); } }
@keyframes nudgeL { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-14px); } }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: clamp(14px, 2.4vh, 24px) 22px; position: relative; }
.card.pick { outline: 3px solid var(--go); outline-offset: -1px; }
.tag { position: absolute; top: 14px; right: 16px; font-size: 13px; font-weight: 700; color: var(--go); text-transform: uppercase; letter-spacing: .04em; }
.name { font-size: clamp(22px, 3vw, 34px); font-weight: 700; }
.name small { font-size: .5em; font-weight: 600; color: var(--text-2); margin-left: 6px; }
.meter { height: clamp(14px, 2.2vh, 22px); background: var(--track); border-radius: 6px; overflow: hidden; margin: 12px 0 6px; }
.meter div { height: 100%; border-radius: 0 6px 6px 0; transition: width .6s; }
.mrow { display: flex; justify-content: space-between; color: var(--text-2); font-size: clamp(14px, 1.7vw, 19px); font-variant-numeric: tabular-nums; }
.food { margin-top: 14px; font-size: clamp(20px, 2.6vw, 30px); font-weight: 750; font-variant-numeric: tabular-nums; }
.food small { font-size: .6em; font-weight: 600; color: var(--text-2); }
.status { margin-top: 6px; font-size: clamp(15px, 1.9vw, 20px); font-weight: 650; display: flex; gap: 14px; flex-wrap: wrap; }
.status i { font-style: normal; margin-right: 6px; }
.badge { color: var(--text-2); font-weight: 600; }
footer { text-align: center; color: var(--text-3); font-size: 13px; padding: 4px 16px 18px; }
.picker { display: grid; gap: 12px; max-width: 480px; margin: 10vh auto; padding: 0 16px; }
.picker a { display: block; padding: 18px 20px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); color: var(--text); text-decoration: none; font-size: 20px; font-weight: 650; }
@media (max-width: 640px) { .hero { grid-template-columns: 1fr; } .arrow { text-align: left; } }
</style>
</head>
<body>
<main id="main"></main>
<footer id="foot">Times are estimates from entry scans · demo with simulated data</footer>
<script>
const params = new URLSearchParams(location.search);
const AT = params.get("at"), DIR = params.get("dir") === "left" ? "left" : "right";
const STATUS = { green: ["good", "●", "Short wait"], amber: ["warning", "▲", "Busy"], red: ["critical", "■", "Very busy"] };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const mins = m => m < 1 ? "&lt;1" : "~" + Math.round(m);

// What a saved minute is worth, in student terms. Concrete beats abstract.
function perk(saving) {
  if (saving >= 8) return "☕ That's a full chai break back";
  if (saving >= 5) return "☕ Enough time for a chai";
  return "";
}

function card(h, here, pick, walkS) {
  const [cls, icon, label] = STATUS[h.status];
  const toFood = h.to_food_min + (here ? 0 : walkS / 60);
  let badge = "";
  if (h.food === "out") badge = "🍲 Food being refilled";
  else if (h.food === "low") badge = "🍲 A tray is running low";
  else if (h.fresh) badge = "✨ Fresh batch just out";
  return `<div class="card ${pick ? "pick" : ""}">
    ${pick ? `<span class="tag">Recommended</span>` : ""}
    <div class="name">${esc(h.name)}<small>${here ? "you're here" : `${walkS} s walk`}</small></div>
    <div class="meter" role="img" aria-label="${Math.min(100, Math.round(100 * h.load))}% full"><div style="width:${Math.min(100, 100 * h.load)}%;background:var(--${cls})"></div></div>
    <div class="mrow"><span>${h.load >= 1 ? "Full" : `${Math.round(100 * h.load)}% full`}</span><span>${h.space > 0 ? `space for ~${h.space}` : `seats freeing up, ~${h.seats_free_per_min}/min`}</span></div>
    <div class="food">${mins(toFood)} <small>min to food</small></div>
    <div class="status"><span><i style="color:var(--${cls})">${icon}</i>${label}</span>${badge ? `<span class="badge">${badge}</span>` : ""}</div>
  </div>`;
}

function render(s) {
  const halls = Object.fromEntries(s.advice.halls.map(h => [h.id, h]));
  const walkS = Math.round(s.switch_walk_s);
  document.getElementById("foot").textContent = `Times are estimates from people who have scanned in · updated ${s.clock} · demo with simulated data`;
  if (s.mode !== "doors" || !AT || !halls[AT]) {
    if (s.mode === "doors") {
      document.getElementById("main").innerHTML = `<div class="picker"><div class="top">Which door is this screen at?</div>` +
        s.advice.halls.map(h => `<a href="?at=${h.id}">Outside ${esc(h.name)}</a>`).join("") + `</div>`;
      return;
    }
    const head = halls[s.advice.headline];
    document.getElementById("main").innerHTML = `<div class="top"><span>Mess advice</span><span class="clock">${s.clock}</span></div>
      <div class="hero ${head.share >= 0.6 ? "go" : "good"}"><div><div class="say">${esc(s.advice.text)}</div></div></div>
      <div class="cards">${s.advice.halls.map(h => card(h, false, head.share >= 0.6 && h.id === head.id, 0)).join("")}</div>`;
    return;
  }

  const here = halls[AT], door = s.doors[AT];
  const other = door.go_to ? halls[door.go_to] : s.advice.halls.find(h => h.id !== AT);
  let heroCls, say, why = "", extra = "", arrow = "";
  if (door.level === "strong") {
    heroCls = "go";
    say = `${esc(other.name)} is faster right now`;
    why = `Food in hand in <b>${mins(other.to_food_min + walkS / 60)} min</b> there, vs <b>${mins(here.to_food_min)} min</b> here`;
    extra = perk(door.saving_min);
    arrow = `<div class="arrow ${DIR} pulse"><span>${DIR === "left" ? "←" : "→"}</span><small>${walkS} s to ${esc(other.name)}</small></div>`;
  } else if (door.level === "soft") {
    heroCls = "warning";
    say = `Busy here. In a hurry?`;
    why = `<b>${esc(other.name)}</b> is about <b>${mins(door.saving_min)} min faster</b> right now, a ${walkS} s walk away`;
    arrow = `<div class="arrow ${DIR}"><span>${DIR === "left" ? "←" : "→"}</span><small>${esc(other.name)}</small></div>`;
  } else if (here.status === "green") {
    heroCls = "good";
    say = `Come on in`;
    why = `Short wait: food in about <b>${mins(here.to_food_min)} min</b>`;
    if (here.fresh) extra = "✨ Fresh batch just out";
  } else {
    heroCls = "warning";
    say = `Busy, but this is still your fastest option`;
    why = `${esc(other.name)} is just as busy right now. Food here in about <b>${mins(here.to_food_min)} min</b>`;
  }
  const pick = door.level === "strong" ? other.id : door.level === "stay" ? AT : null;
  document.getElementById("main").innerHTML = `
    <div class="top"><span>Outside <b>${esc(here.name)}</b> · live</span><span class="clock">${s.clock}</span></div>
    <div class="hero ${heroCls}">
      <div><div class="say">${say}</div><div class="why">${why}</div>${extra ? `<div class="perk">${extra}</div>` : ""}</div>
      ${arrow}
    </div>
    <div class="cards">${card(here, true, pick === AT, walkS)}${s.advice.halls.filter(h => h.id !== AT).map(h => card(h, false, pick === h.id, walkS)).join("")}</div>`;
}

async function poll() {
  try { render(await (await fetch("/api/state")).json()); }
  catch (e) { document.getElementById("foot").textContent = "Reconnecting…"; }
}
poll(); setInterval(poll, 1500);
</script>
</body>
</html>
