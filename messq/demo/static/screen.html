<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which Mess Now</title>
<style>
:root {
  color-scheme: dark;
  --bg: #111110; --surface: #1a1a19; --border: #2e2e2c;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e88;
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f3f0; --surface: #fcfcfb; --border: #e3e2de;
    --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f3f0; --surface: #fcfcfb; --border: #e3e2de;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 1100px; width: 100%; margin: 0 auto; padding: 24px 16px; }
.eyebrow { color: var(--text-2); font-size: clamp(14px, 2vw, 20px); }
.advice { font-size: clamp(40px, 8vw, 96px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; margin: 4px 0 8px; }
.why { color: var(--text-2); font-size: clamp(16px, 2.4vw, 26px); margin-bottom: 28px; }
.halls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.hall { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 20px 22px; border-left-width: 8px; }
.hall.green { border-left-color: var(--good); } .hall.amber { border-left-color: var(--warning); } .hall.red { border-left-color: var(--critical); }
.hall.pick { outline: 2px solid var(--text); outline-offset: 2px; }
.name { font-size: clamp(22px, 3vw, 34px); font-weight: 700; }
.wait { font-size: clamp(36px, 6vw, 64px); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 6px 0; }
.wait small { font-size: 0.4em; font-weight: 600; color: var(--text-2); }
.status { font-size: clamp(16px, 2vw, 22px); font-weight: 650; }
.status i { font-style: normal; margin-right: 6px; }
.green .status i { color: var(--good); } .amber .status i { color: var(--warning); } .red .status i { color: var(--critical); }
.food { margin-top: 6px; color: var(--text-2); font-size: clamp(14px, 1.8vw, 18px); }
footer { text-align: center; color: var(--text-3); font-size: 13px; padding: 12px 16px 18px; }
</style>
</head>
<body>
<main>
  <div class="eyebrow" id="eyebrow">Mess advice · updating live</div>
  <div class="advice" id="advice">…</div>
  <div class="why" id="why"></div>
  <div class="halls" id="halls"></div>
</main>
<footer><span id="clock"></span> · Wait times are estimates from entry scans · Demo with simulated data</footer>
<script>
const STATUS = { green: ["●", "Short wait"], amber: ["▲", "Busy"], red: ["■", "Very busy"] };
const FOOD = { low: "🍲 Tray running low", out: "🍲 Food being refilled" };
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
async function poll() {
  try {
    const s = await (await fetch("/api/state")).json();
    const a = s.advice, head = a.halls.find(h => h.id === a.headline);
    const decisive = head.share >= 0.6;
    document.getElementById("advice").textContent = a.text;
    const others = a.halls.filter(h => h.id !== head.id);
    const saved = others.length ? Math.round(Math.min(...others.map(h => h.wait_min)) - head.wait_min) : 0;
    document.getElementById("why").textContent = decisive
      ? `${Math.round(head.share * 10)} in 10 students are heading to ${head.name} now` + (saved >= 2 ? ` · saves you about ${saved} min` : "")
      : "Waits are about the same. Pick either one.";
    document.getElementById("halls").innerHTML = a.halls.map(h => {
      const [icon, label] = STATUS[h.status];
      return `<div class="hall ${h.status} ${decisive && h.id === head.id ? "pick" : ""}">
        <div class="name">${esc(h.name)}</div>
        <div class="wait">${h.wait_min < 1 ? "&lt;1" : "~" + Math.round(h.wait_min)}<small> min wait</small></div>
        <div class="status"><i>${icon}</i>${label}</div>
        ${FOOD[h.food] ? `<div class="food">${FOOD[h.food]}</div>` : ""}
      </div>`;
    }).join("");
    document.getElementById("clock").textContent = s.clock;
  } catch (e) { document.getElementById("eyebrow").textContent = "Reconnecting…"; }
}
poll(); setInterval(poll, 1500);
</script>
</body>
</html>
