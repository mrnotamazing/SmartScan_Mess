# Smart Mess Queue Balancer - default configuration.
#
# Every number tagged ASSUMED is a placeholder chosen to be plausible for a
# college mess. Replace it with a measured value before trusting results.
# Credentials (scanner IP, API user/password, ID salt) NEVER go in this file:
# they are read from environment variables (see README).

[engine]
rate_window_min = 5           # window for the arrival-rate estimate (scans/min)
horizon_min = 5               # how far ahead a recommendation is assumed to apply
normal_visit_min = 18         # MEASURED (approx.): scan to leaving on a NORMAL day. Surges add queue time.
stay_mean_min = 17            # derived (calibrated in the simulator): the ~18 min normal visit minus ~1 min of normal queueing and serving.
                              # The queue part is estimated live, so a surge lengthens the visit automatically.
routing_update_s = 30         # how often the recommended split is recomputed
routing_smoothing = 0.5       # EMA weight on the newest split (1 = no smoothing)
min_share = 0.05              # never send less than 5% to any open hall (keeps estimates alive)
amber_wait_min = 5            # status thresholds on predicted wait (excluding walk)
red_wait_min = 10
food_low_penalty_min = 2      # ASSUMED: extra expected delay when kitchen tapped "tray low"
food_out_grace_min = 5        # an "out" tap expires this long after the expected refill time
food_low_expiry_min = 20      # a "low" tap expires after this long (staff forget to tap "refilled")
assumed_compliance = 1.0      # set < 1 to over-correct for students who ignore advice
                              # (needs [engine.natural_share], e.g. from a no-screen baseline day)

[engine.natural_share]          # ASSUMED (pure assumption, group's estimate): share who go to each mess by habit
A = 0.85
B = 0.15

[layout]
mode = "doors"                # "doors": a screen outside each mess entrance (students see it at the
                              #   mess they were walking to, then go in or walk to the other one)
                              # "hallway": one shared screen before the paths to the messes split
switch_walk_s = 30            # ASSUMED: walk from one mess door to the other
min_saving_min = 2            # only suggest switching if it saves at least this many minutes

[privacy]
salt_env = "MESSQ_ID_SALT"    # env var holding the secret used to pseudonymise student IDs
retention_days = 30           # delete scan logs older than this (DPDP Act: minimise + limit)
show_names = false            # uploaded real logs: show the name column in the live sheet? Keep false until
                              # the college has approved it; IDs are then shown pseudonymised. Simulated
                              # students always get made-up names.

[[mess]]
id = "A"
name = "Central Mess"
seats = 900                   # MEASURED: Central CT seating capacity
counters = 2                  # MEASURED: serving stations
service_rate_per_counter_per_min = 10.0  # ASSUMED (~6 s per student). Must be roughly this fast: ~2,500 students reach
                              #   Central in 3 hours, and 2 lines at the old guess of 4/min could only serve 8/min.
                              #   Measure with a stopwatch.
scanners = 1                  # MEASURED: one face-scan terminal at the entrance
scan_time_s = 2               # ASSUMED: seconds per scan (step up, recognise, move on). Time it.
walk_time_s = 30              # hallway layout only: from the shared screen to this hall
food_batch = 900              # ASSUMED: portions of the main item per batch
food_refill_trigger = 500     # ASSUMED: the mess calls the kitchen ("running low") at this stock
food_refill_time_min = 30     # MEASURED: "running low" call-back -> kitchen makes it and sends it, 30 min in total
food_ready_refill_min = [10, 14]  # MEASURED: if the food is already made, it only has to be sent: 10-14 min
food_ready_prob = 0.7         # GROUP ESTIMATE: food is already made about 70% of the time when the mess calls
items = ["Main course", "Rice", "Roti", "Dal"]   # trays on the kitchen page; the first is the main one

[[mess]]
id = "B"
name = "Munch Mess"
seats = 500                   # MEASURED: Munch Mess seating capacity
counters = 2                  # MEASURED: serving stations
service_rate_per_counter_per_min = 10.0  # ASSUMED, as for Central
scanners = 1                  # MEASURED
scan_time_s = 2               # ASSUMED
walk_time_s = 30
food_batch = 500              # ASSUMED (sized for Munch's share when the screens rebalance)
food_refill_trigger = 300     # ASSUMED
food_refill_time_min = 30     # MEASURED: "running low" call-back -> kitchen makes it and sends it, 30 min in total
food_ready_refill_min = [10, 14]  # MEASURED: if the food is already made, it only has to be sent: 10-14 min
food_ready_prob = 0.7         # GROUP ESTIMATE: food is already made about 70% of the time when the mess calls

# ---------------------------------------------------------------------------
# Simulation only (fake data). Nothing here touches a real scanner.
# ---------------------------------------------------------------------------
[simulation]
step_s = 5                    # simulation tick = scanner poll interval
compliance = 0.6              # ASSUMED: share of students who follow the advice
staff_signal_prob = 0.9       # chance kitchen staff actually tap "tray low"/"out"/"refilled"
stay_mean_min = 17            # true time spent eating (lognormal); plus queueing gives ~18 min on a normal day
stay_sd_min = 5
service_cv = 0.6              # variability of serving time (1.0 = exponential, as M/M/c assumes)

[simulation.habit_share]      # ASSUMED (pure assumption, group's estimate): where students go by habit without advice
A = 0.85
B = 0.15

[[simulation.slot]]
name = "breakfast"
start = "07:30"
duration_min = 120
expected_students = 1100
peak_offset_min = 50
spread_min = 25

[[simulation.slot]]
name = "lunch"
start = "11:30"               # MEASURED: lunch runs 11:30–14:30
duration_min = 180
expected_students = 2960      # MEASURED: plates served at lunch (Central CT + Munch Mess)
peak_offset_min = 95          # ASSUMED shape: busiest around 13:05 (field visit saw full load ~13:18).
spread_min = 35               #   The biometric logs will give the real arrival curve.

[[simulation.slot]]
name = "dinner"
start = "19:30"
duration_min = 150
expected_students = 1500
peak_offset_min = 45
spread_min = 30
