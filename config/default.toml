alt_start = "13:00"           #   ASSUMED 5-day week and ~25% of MIT in electrical -> 0.75*2/5 + 0.25*3/5 = 0.45
alt_end = "14:00"

[[simulation.slot.group]]
name = "TAPMI"
students = 850
start = "13:05"
end = "14:00"

[[simulation.slot.group]]
name = "DOC/MICFE"
students = 550
start = "12:30"
end = "13:30"

[[simulation.slot.group]]
name = "SMI"
students = 450
start = "12:00"
end = "13:00"

