# ---------------------------------------------------------------------------
# Tray weights, from the ABC/XYZ priority matrix (MDS_dataset.xlsx, "Menu & Ratings").
# The mess manager marks a tray "running low", "out" or "refilled"; the weight decides how
# much that changes the advice on the door screens:
#   * a STAR DISH that runs OUT, whatever the dish, is an outage: that mess serves nobody until the
#     refill (matrix: "the one item everyone notices when it is gone"), so students are sent to the
#     other mess for as long as that is faster;
#   * any other tray OUT adds  weight x expected minutes until its refill  to that mess's wait;
#   * any tray "running low" adds  weight x expected gap between emptying and the refill (often 0).
#   Refill times are counted from the kitchen call and updated as time passes without a refill.
# Weights are the group's reading of the matrix (to confirm with the CT manager):
#   class A (cost of running out High) above class C; within A, items students come for
#   (star dish) above items made continuously (chapati), one-per-plate sweets and fresh sides;
#   C items (base food) are interchangeable, so a shortfall is "quietly absorbed by another".
#   Table items (salt, pickle, fryums: class CX, "free issue") are not tracked.
# ---------------------------------------------------------------------------
[[tray]]
name = "Gravy sabji"          # rajma masala, paneer/chicken curries...
type = "Star dish"
class = "AZ"                  # Tight Control
weight = 1.0

[[tray]]
name = "Special rice"         # the pulaos, biryani
type = "Star dish"
class = "AZ"
weight = 1.0

[[tray]]
name = "Roti"                 # chapatis: running out is a SPEED problem (another tawa fixes it)
type = "Made fresh in batches"
class = "AZ"
weight = 0.5

[[tray]]
name = "Dessert"              # one per plate: demand = plate count
type = "One per plate"
class = "AX"                  # Calculated Issue
weight = 0.3

[[tray]]
name = "Curd / raita"         # roughly one portion each; the risk is surplus more than shortage
type = "Fresh side"
class = "AZ"
weight = 0.3

[[tray]]
name = "Dry sabji"
type = "Base food"
class = "CZ"                  # Buffered Issue
weight = 0.1

[[tray]]
name = "Dal"
type = "Base food"
class = "CZ"
weight = 0.1

[[tray]]
name = "Rice"
type = "Base food"
class = "CZ"
weight = 0.1

[[tray]]
name = "Sambar / rasam"
type = "Base food"
class = "CZ"
weight = 0.1
